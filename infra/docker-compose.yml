services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gastio
      POSTGRES_USER: gastio
      POSTGRES_PASSWORD: gastio
    ports:
      - "5432:5432"
    volumes:
      - gastio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastio -d gastio"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gastio_postgres:
