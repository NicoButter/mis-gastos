name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gastio
          POSTGRES_USER: gastio
          POSTGRES_PASSWORD: gastio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gastio -d gastio"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://gastio:gastio@localhost:5432/gastio
      DATABASE_TEST_NAME: gastio_test
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m black --check .
        working-directory: backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/gastio-openapi.yml
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: gastio_e2e
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gastio_e2e -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://gastio_e2e:ci-only-password@127.0.0.1:5432/postgres
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements/dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
