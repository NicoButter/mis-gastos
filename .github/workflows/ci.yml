name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gastio
          POSTGRES_USER: gastio
          POSTGRES_PASSWORD: gastio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gastio -d gastio"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://gastio:gastio@localhost:5432/gastio
      DATABASE_TEST_NAME: gastio_test
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python -m ruff check .
        working-directory: backend
      - run: python -m black --check .
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
